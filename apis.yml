aid: hibachi
name: Hibachi
description: >-
  Hibachi is a stablecoin-native, privacy-first decentralized exchange for perpetual futures and FX
  trading. Built by contributors from Citadel, Tower Research, IMC, Meta, Google and Amazon, it pairs
  a low-latency central-limit-orderbook trading engine with a zk-verified settlement layer, so
  collateral only moves on-chain when validated by a zero-knowledge proof. Hibachi exposes a public
  REST and WebSocket API across two hosts (api.hibachi.xyz for account, trading and capital
  operations; data-api.hibachi.xyz for market data), an official Python SDK, a TypeScript example
  integration, and a CCXT integration. Authentication uses an API key in the Authorization header,
  and order, withdraw and transfer operations additionally require an ECDSA or HMAC request
  signature. It is backed by Electric Capital.
